# ==== FastAPI 服务配置 ====
[fastapi]
title=物品收纳整理系统（小组作业演示版）
description=FastAPI 后端，本地演示用
version=1.0.0
docs_url=/docs
redoc_url=/redocs
debug=False
timeout=600

# ==== AI 大模型配置（智谱 GLM-4V）====
# 填了真 key 就走真识别；保持占位符则自动返回演示用的模拟识别结果
[zhipu]
zhipu_api_key = f4bff19c9a344a90abc69cbf7fde6c45.halMiujm9FS5yJ3J
model = glm-4v-flash
temperature = 1.0
max_completion_tokens = 1000
# 决策/文案用的纯文本模型（v5 决策层 + 处理建议）
decision_model = glm-4-flash

# ==== 微信小程序配置 ====
# 有真实小程序 AppID/AppSecret 就填进来；演示模式不需要
[weixin]
AppID = YOUR APP ID
AppSecret = YOUR App Secret

# ==== 演示模式 ====
# enabled=1：登录不走微信接口，直接返回固定的演示 openid（离线可演示）
# mock_ai=1：拍照识别返回模拟结果，不调用智谱（省 key、省流量）
[demo]
enabled = 1
mock_ai = 0
